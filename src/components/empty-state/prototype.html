<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>empty-state — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--accent-text:#FCFCF9;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--accent-text:#14120F;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(26rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
.empty{display:grid;justify-items:center;gap:.7rem;text-align:center;padding:2.5rem 1.5rem;border:1px dashed var(--border);border-radius:.75rem}
.empty .icon{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:999px;background:var(--accent-subtle);color:var(--accent)}
.empty h3{font:500 1.05rem/1.3 "Newsreader",Georgia,serif;margin:0}
.empty p{margin:0;font-size:.85rem;color:var(--muted);max-width:18rem}
.btn{font:500 .875rem/1 "Geist";background:var(--accent);color:var(--accent-text);border:0;border-radius:.5rem;padding:.55rem .9rem;cursor:pointer;margin-top:.3rem}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.ghost{background:none;color:var(--accent)}
</style>
<h1>Empty state</h1>

<section>
  <h2>還沒有記憶</h2>
  <div class="empty">
    <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 12a1.5 1.5 0 1 0 1.5-1.5A4 4 0 1 0 16.5 15 6.5 6.5 0 1 1 10 5.6"/><path d="M10 5.6C7.5 5 5.5 5.8 4 7.5"/><path d="M16.5 15c1.8.3 3.3 1.5 4.5 3.5"/></svg></span>
    <h3>還沒有記憶</h3>
    <p>線還沒開始織。開始第一個 thread,重要的事會自動留下來,換班時帶得走。</p>
    <button class="btn">開始第一個 thread</button>
  </div>
</section>

<section>
  <h2>找不到符合的 thread</h2>
  <div class="empty">
    <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <h3>找不到符合的 thread</h3>
    <p>「部署流程」沒有結果。換個關鍵字,或把篩選條件清掉再找一次。</p>
    <button class="btn ghost">清除篩選</button>
  </div>
</section>

<section>
  <h2>這一天沒有紀錄</h2>
  <div class="empty">
    <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>
    <h3>這一天沒有紀錄</h3>
    <p>8 月 26 日工作區是安靜的。跳到最近一次有換班的日子看看。</p>
    <button class="btn ghost">跳到最近的紀錄</button>
  </div>
</section>
</html>
