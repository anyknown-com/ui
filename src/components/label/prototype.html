<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>label — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--danger:#B3402E;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--danger:#DD7059;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
.label{font:500 .875rem/1.3 "Geist";display:flex;align-items:baseline;gap:.35rem}
.label .req{color:var(--danger)}
.label .optional{font-weight:400;font-size:.75rem;color:var(--faint)}
.help{font-size:.8rem;color:var(--muted);margin:0}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font:inherit;font-size:.9rem;padding:.5rem .75rem;min-height:2.25rem}
.input:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
.group:has(:disabled) .label,.group:has(:disabled) .help{opacity:.5}
.group{display:grid;gap:.4rem}
</style>
<h1>Label</h1>

<section>
  <h2>default</h2>
  <div class="group">
    <label class="label" for="a">顯示名稱</label>
    <input class="input" id="a">
  </div>
</section>

<section>
  <h2>required</h2>
  <div class="group">
    <label class="label" for="b">Email <span class="req" aria-hidden="true">*</span></label>
    <input class="input" id="b" required aria-required="true">
  </div>
</section>

<section>
  <h2>optional 標記 + help</h2>
  <div class="group">
    <label class="label" for="c">邀請碼 <span class="optional">選填</span></label>
    <input class="input" id="c">
    <p class="help">有邀請碼可以直接加入既有工作區。</p>
  </div>
</section>

<section>
  <h2>跟隨 disabled 控件淡出(:has)</h2>
  <div class="group">
    <label class="label" for="d">裝置名稱</label>
    <input class="input" id="d" disabled value="Senlima 的 MacBook">
    <p class="help">由系統偵測,無法修改。</p>
  </div>
</section>
</html>
