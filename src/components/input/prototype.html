<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>input — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
label{font:500 .875rem/1.3 "Geist";display:block}
.help{font-size:.8rem;color:var(--muted);margin:0}
.error-msg{font-size:.8rem;color:var(--danger);margin:0}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font:inherit;font-size:.9rem;padding:.5rem .75rem;min-height:2.25rem;transition:border-color 120ms}
.input::placeholder{color:var(--faint)}
.input:hover{border-color:var(--border-strong)}
.input:focus-visible{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.input:disabled{opacity:.5;cursor:not-allowed}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input[aria-invalid="true"]:focus-visible{outline-color:var(--danger)}
.input.sm{min-height:1.75rem;padding:.25rem .6rem;font-size:.8rem}
.affix{position:relative}
.affix svg{position:absolute;left:.65rem;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none}
.affix .input{padding-left:2.1rem}
</style>
<h1>Input</h1>

<section>
  <h2>default + label + help</h2>
  <label for="a">工作區名稱</label>
  <input class="input" id="a" placeholder="例如:anyknown">
  <p class="help">之後可以在設定裡改。</p>
</section>

<section>
  <h2>size sm</h2>
  <input class="input sm" placeholder="搜尋記憶…">
</section>

<section>
  <h2>leading icon</h2>
  <div class="affix">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="input" placeholder="搜尋 thread…">
  </div>
</section>

<section>
  <h2>error</h2>
  <label for="b">Email</label>
  <input class="input" id="b" aria-invalid="true" aria-describedby="b-err" value="admin@anyknown">
  <p class="error-msg" id="b-err">Email 格式不完整,少了網域。</p>
</section>

<section>
  <h2>disabled</h2>
  <input class="input" disabled value="senlima@anyknown.com">
</section>
</html>
