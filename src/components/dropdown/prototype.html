<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dropdown — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem 20rem;display:grid;gap:1rem;justify-content:center;align-content:start}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0 0 .5rem}
.trigger{background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font:500 .875rem/1.2 "Geist";padding:.5rem 1rem;min-height:2.25rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.trigger:hover{border-color:var(--border-strong)}
.trigger:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{position:relative;justify-self:start}
.menu{position:absolute;z-index:10;top:calc(100% + 6px);left:0;min-width:14rem;background:var(--surface);border:1px solid var(--border);border-radius:.6rem;box-shadow:var(--shadow);padding:.3rem;margin:0;list-style:none;transform-origin:top left;animation:in 140ms ease-out}
@keyframes in{from{opacity:0;scale:.97}}
.menu[hidden]{display:none}
.item{position:relative;display:flex;align-items:center;gap:.55rem;border-radius:.4rem;padding:.42rem .6rem;font-size:.85rem;cursor:pointer;color:var(--text)}
.item:hover,.item:focus-visible,.item:has(.menu:hover){background:var(--accent-subtle);outline:none}
.item svg{color:var(--muted);flex:none}
.item .kbd{margin-left:auto;font:400 .68rem/1 "Geist Mono",ui-monospace,monospace;color:var(--faint)}
.item.danger,.item.danger svg{color:var(--danger)}
.item .tick{width:.9rem;color:var(--accent);visibility:hidden;flex:none}
.item[aria-checked="true"] .tick{visibility:visible}
.group-label{font:600 .65rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:.55rem .6rem .35rem}
.sep{border-top:1px solid var(--border);margin:.3rem .35rem}
.sub>.arrow{margin-left:auto;color:var(--faint)}
.sub>.menu{top:-0.35rem;left:calc(100% + 2px);display:none;animation:in 120ms ease-out}
.sub:hover>.menu,.sub:focus-within>.menu{display:block}
.hint{font-size:.8rem;color:var(--muted);max-width:26rem}
@media(prefers-reduced-motion:reduce){.menu{animation:none}}
</style>
<h1>Dropdown Menu</h1>
<p class="hint">含 group、separator、checkbox item、快捷鍵提示、兩層 submenu(hover 或鍵盤 focus 展開)。</p>

<div class="wrap">
  <button class="trigger" aria-haspopup="menu" aria-expanded="false" onclick="const m=this.nextElementSibling;m.hidden=!m.hidden;this.setAttribute('aria-expanded',String(!m.hidden))">
    Thread 動作
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <ul class="menu" role="menu" hidden>
    <li class="group-label">這條 thread</li>
    <li class="item" role="menuitem" tabindex="0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新增交接備註<span class="kbd">⌘N</span></li>
    <li class="item" role="menuitem" tabindex="0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜尋這一天<span class="kbd">⌘F</span></li>
    <li class="item sub" role="menuitem" tabindex="0" aria-haspopup="menu">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      匯出
      <svg class="arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      <ul class="menu" role="menu">
        <li class="item" role="menuitem" tabindex="0">Markdown</li>
        <li class="item" role="menuitem" tabindex="0">JSON</li>
        <li class="item sub" role="menuitem" tabindex="0" aria-haspopup="menu">
          範圍…
          <svg class="arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          <ul class="menu" role="menu">
            <li class="item" role="menuitem" tabindex="0">今天</li>
            <li class="item" role="menuitem" tabindex="0">最近 7 天</li>
            <li class="item" role="menuitem" tabindex="0">整條 thread</li>
          </ul>
        </li>
      </ul>
    </li>
    <li class="sep" role="separator"></li>
    <li class="group-label">顯示</li>
    <li class="item" role="menuitemcheckbox" aria-checked="true" tabindex="0" onclick="this.setAttribute('aria-checked',String(this.getAttribute('aria-checked')!=='true'))"><span class="tick">✓</span>顯示換班回條</li>
    <li class="item" role="menuitemcheckbox" aria-checked="false" tabindex="0" onclick="this.setAttribute('aria-checked',String(this.getAttribute('aria-checked')!=='true'))"><span class="tick">✓</span>顯示工具呼叫</li>
    <li class="sep" role="separator"></li>
    <li class="item danger" role="menuitem" tabindex="0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>刪除這一天的紀錄</li>
  </ul>
</div>

<script>
document.addEventListener("click", e => {
  if (e.target.closest(".wrap")) return
  const m = document.querySelector(".wrap > .menu")
  m.hidden = true
  document.querySelector(".trigger").setAttribute("aria-expanded", "false")
})
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return
  document.querySelector(".wrap > .menu").hidden = true
  document.querySelector(".trigger").focus()
})
</script>
</html>
