<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skeleton — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--text:#23211D;--muted:#777165;--faint:#9C958A;--bone:#ECE9DF;--sheen:#F6F4EC}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--bone:#2A2620;--sheen:#35302A}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(26rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
p.hint{font-size:.8rem;color:var(--muted);margin:0}
.sk{background:var(--bone);border-radius:.4rem;background-image:linear-gradient(100deg,transparent 30%,var(--sheen) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:180% 0}to{background-position:-80% 0}}
@media(prefers-reduced-motion:reduce){
  .sk{background-image:none;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
}
.line{height:.8rem}
.avatar{width:2.25rem;height:2.25rem;border-radius:999px;flex:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;padding:1rem;display:grid;gap:.6rem}
.row{display:flex;gap:.7rem;align-items:center}
.stack{display:grid;gap:.45rem;flex:1}
.thread{display:grid;gap:.9rem}
.bubble-user{justify-self:end;width:55%;height:2.4rem;border-radius:.75rem .75rem .2rem .75rem}
.asst{display:flex;gap:.7rem;align-items:flex-start}
</style>
<h1>Skeleton</h1>
<p class="hint">刻意不用線的 texture:載入骨架要低調不搶戲,用現代 rounded shimmer(見 ROADMAP 的 texture 準則)。</p>

<section>
  <h2>文字行</h2>
  <div class="stack" role="status" aria-label="載入中">
    <div class="sk line" style="width:100%"></div>
    <div class="sk line" style="width:92%"></div>
    <div class="sk line" style="width:61%"></div>
  </div>
</section>

<section>
  <h2>頭像 + 兩行</h2>
  <div class="row" role="status" aria-label="載入中">
    <div class="sk avatar"></div>
    <div class="stack">
      <div class="sk line" style="width:38%"></div>
      <div class="sk line" style="width:70%"></div>
    </div>
  </div>
</section>

<section>
  <h2>卡片</h2>
  <div class="card" role="status" aria-label="載入中">
    <div class="sk line" style="width:45%;height:1rem"></div>
    <div class="sk line" style="width:100%"></div>
    <div class="sk line" style="width:83%"></div>
  </div>
</section>

<section>
  <h2>thread 載入中(user 氣泡 + assistant 段落)</h2>
  <div class="thread" role="status" aria-label="thread 載入中">
    <div class="sk bubble-user"></div>
    <div class="asst">
      <div class="sk avatar" style="width:1.6rem;height:1.6rem"></div>
      <div class="stack">
        <div class="sk line" style="width:96%"></div>
        <div class="sk line" style="width:88%"></div>
        <div class="sk line" style="width:93%"></div>
        <div class="sk line" style="width:47%"></div>
      </div>
    </div>
  </div>
</section>
</html>
