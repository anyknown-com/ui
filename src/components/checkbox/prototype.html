<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>checkbox — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
p.hint{font-size:.8rem;color:var(--muted);margin:0}
.seedbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.seedbar button,.seedbar input{font:500 .8rem/1.2 "Geist",system-ui,sans-serif;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:.4rem;padding:.35rem .7rem}
.seedbar button{cursor:pointer}
.seedbar input{width:6.5rem}
.seedbar label{display:inline-flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--muted)}
.seedbar code{font:600 .8rem/1 "Geist Mono",ui-monospace,monospace;color:var(--accent)}

.cb{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.cb input{position:absolute;opacity:0;width:1.05rem;height:1.05rem;margin:0;cursor:pointer}
.box{flex:none;width:1.05rem;height:1.05rem;margin-top:.16rem;border:1px solid var(--border);border-radius:.3rem;background:var(--surface);overflow:hidden;transition:border-color 160ms}
.box svg{display:block;width:100%;height:100%}
.cloth path{fill:none;stroke-linecap:round}
/* 紗線色(primary,抄 button prototype) */
.box{--y-un:#11362C;--y-sh:#123C31;--y0:#1E6250;--y1:#216A55;--y2:#23705A;--y3:#28795F;--y4:#2E8266;--y-hi:#5CAA89}
@media(prefers-color-scheme:dark){.box{--y-un:#173629;--y-sh:#1B4437;--y0:#3F8A70;--y1:#47957A;--y2:#4FA184;--y3:#56A98B;--y4:#5EB193;--y-hi:#8FD2B4}}
/* 勾選 = 布織進格子(clip 的 width 從左往右推進,紗本身不動)。
   勾是縫在布上的線(同 seed 的長波微彎 + 陰影股,線色 accent-text),
   跟布掛同一個 clip — 前緣推到哪,布和勾一起被織出來,不是布好了才畫勾。 */
.weave{height:24px;width:0;transition:width 200ms cubic-bezier(.32,.85,.45,1)}
.mark path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mark .th-sh{stroke:rgba(9,20,16,.32)}
.mark .th-core{stroke:var(--accent-text)}
.cb input:checked+.box,.cb input:indeterminate+.box{border-color:var(--accent)}
.cb input:checked+.box .weave,.cb input:indeterminate+.box .weave{width:24px}
.cb input:indeterminate+.box .check{display:none}
.cb input:not(:indeterminate)+.box .dash{display:none}
.cb input:focus-visible+.box{outline:2px solid var(--focus);outline-offset:2px}
.cb:has(input:disabled){opacity:.5;cursor:not-allowed}
.cb b{font-weight:500;font-size:.9rem;display:block}
.cb small{font-size:.8rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.box,.weave,.mark path{transition:none}}
</style>
<h1>Checkbox — 布織進格子</h1>
<p class="hint">勾選 = 布從左織進格子(織法與 button 同源:固定種子 10075 的紗線堆疊,
依實際顯示尺寸換算,紗的粗細行距與 button 在螢幕上等粗)。勾是縫在布上的線
(帶同一塊布的長波微彎與線影,不是平面 icon),跟布一起被前緣織出來。取消則整塊退出。
選取控件保持安靜:靜態織紋、無 rAF。</p>

<section>
  <h2>織法種子</h2>
  <div class="seedbar">
    <button type="button" id="reroll">🎲 重織</button>
    <label>seed <input id="seedInput" type="number" min="1" step="1"></label>
    <code id="seedShow"></code>
  </div>
</section>

<section>
  <h2>基本</h2>
  <label class="cb"><input type="checkbox" checked><span class="box"><svg viewBox="0 0 24 24"><g class="cloth"></g><g class="mark"><g class="check"></g><g class="dash"></g></g></svg></span><span><b>記住這台裝置</b></span></label>
  <label class="cb"><input type="checkbox"><span class="box"><svg viewBox="0 0 24 24"><g class="cloth"></g><g class="mark"><g class="check"></g><g class="dash"></g></g></svg></span><span><b>換班時通知我</b><small>每次 handoff 都會收到桌面通知。</small></span></label>
</section>

<section>
  <h2>indeterminate(部分選取)</h2>
  <label class="cb"><input type="checkbox" id="ind"><span class="box"><svg viewBox="0 0 24 24"><g class="cloth"></g><g class="mark"><g class="check"></g><g class="dash"></g></g></svg></span><span><b>全選記憶(3 / 7)</b></span></label>
</section>

<section>
  <h2>disabled</h2>
  <label class="cb"><input type="checkbox" checked disabled><span class="box"><svg viewBox="0 0 24 24"><g class="cloth"></g><g class="mark"><g class="check"></g><g class="dash"></g></g></svg></span><span><b>端對端加密</b><small>永遠開啟。</small></span></label>
</section>

<script>
// 幾何抄 TEXTURE-GUIDE §3。格子顯示尺寸 14.8 CSS px(1.05rem − 2px border),
// viewBox 24 → s = 24/14.8:以 CSS px 建幾何、輸出乘 s,螢幕上紗的粗細行距
// 與 button 完全等粗。靜態織紋,無 rAF。
// 勾/橫線 = 縫線:沿路徑取樣,疊一支長波(波長 ≥ 路徑長,同 rng 序列)的法向微彎,
// 陰影股 + 本體股兩層 — 勾也是線,不是平面 icon。
const NS = "http://www.w3.org/2000/svg"
let uid = 0
let SEED = (() => {
	const m = location.hash.match(/seed=(\d+)/)
	return m ? parseInt(m[1], 10) : 10075
})()

function mulberry32(seed) {
	let a = seed >>> 0
	return () => {
		a |= 0; a = (a + 0x6D2B79F5) | 0
		let t = Math.imul(a ^ (a >>> 15), 1 | a)
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296
	}
}

function el(name, attrs, parent) {
	const node = document.createElementNS(NS, name)
	for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
	parent?.append(node)
	return node
}

function weave(cloth, w, h, rx, s, rand) {
	cloth.replaceChildren()
	const id = `cbc${uid++}`
	weave.lastId = id
	const W1 = rand(Math.max(120, w * 0.9), w * 1.8)
	const A1 = rand(1.0, 1.8), P1 = rand(0, 6.28), K1 = rand(0.05, 0.11)
	const W2 = rand(w * 1.6, w * 3)
	const A2 = rand(0.5, 0.9), P2 = rand(0, 6.28), K2 = rand(0.03, 0.07)
	const field = (x, y) =>
		A1 * Math.sin((x / W1) * 6.283 + P1 + y * K1) +
		A2 * Math.sin((x / W2) * 6.283 + P2 + y * K2)
	const staticD = (y0) => {
		let d = ""
		for (let x = -4; x <= w + 4; x += 4)
			d += `${d ? "L" : "M"}${(x * s).toFixed(2)},${((y0 + field(x, y0)) * s).toFixed(2)}`
		return d
	}
	const defs = el("defs", {}, cloth)
	el("clipPath", { id }, defs)
		.append(el("rect", { class: "weave", x: 0, y: 0, rx }, null))
	const body = el("g", { "clip-path": `url(#${id})` }, cloth)
	const under = el("g", { stroke: "var(--y-un)" }, body)
	for (let y = -0.8; y < h + 2.6; y += 1.5)
		el("path", { d: staticD(y), "stroke-width": (3.4 * s).toFixed(2) }, under)
	const seams = el("g", { stroke: "var(--y-sh)", opacity: ".5" }, body)
	for (let y = 1.6; y < h + 1; y += 2.4)
		el("path", { d: staticD(y), "stroke-width": (rand(0.5, 0.8) * s).toFixed(2) }, seams)
	for (let y = 0.6; y < h + 1; y += 1.2 + rand(-0.15, 0.15)) {
		const bucket = Math.min(4, Math.max(0, Math.round(4.2 - (y / h) * 3 + rand(-0.9, 0.9))))
		el("path", { d: staticD(y), "stroke-width": (rand(0.6, 1.4) * s).toFixed(2), stroke: `var(--y${bucket})` }, body)
	}
	const hi = el("g", { stroke: "var(--y-hi)", opacity: ".45" }, body)
	for (let i = 0; i < 4; i++) {
		const y = rand(2, h * 0.6)
		el("path", { d: staticD(y), "stroke-width": (rand(0.4, 0.7) * s).toFixed(2) }, hi)
	}
}

// 縫線:pts 折線(viewBox 座標)→ 沿弧長疊一支長波的法向偏移,陰影股 + 本體股
function thread(group, pts, rand) {
	group.replaceChildren()
	const samples = []
	let L = 0
	for (let i = 0; i < pts.length - 1; i++) {
		const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]
		const len = Math.hypot(x1 - x0, y1 - y0)
		const nx = -(y1 - y0) / len, ny = (x1 - x0) / len
		const n = Math.ceil(len)
		for (let j = i === 0 ? 0 : 1; j <= n; j++) {
			const t = j / n
			samples.push({ x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, nx, ny, l: L + len * t })
		}
		L += len
	}
	const A = rand(0.25, 0.45), WL = rand(L * 1.2, L * 2), PH = rand(0, 6.28)
	let d = ""
	for (const p of samples) {
		const off = A * Math.sin((p.l / WL) * 6.283 + PH)
		d += `${d ? "L" : "M"}${(p.x + p.nx * off).toFixed(2)},${(p.y + p.ny * off).toFixed(2)}`
	}
	el("path", { class: "th-sh", d, "stroke-width": "2.1", transform: "translate(0.35 0.5)" }, group)
	el("path", { class: "th-core", d, "stroke-width": "1.95" }, group)
}

// 勾/橫線的骨架(原 icon 路徑經 translate(4.2 4.2) scale(.65) 換算成 viewBox 座標)
const CHECK_PTS = [[5.83, 12.33], [10.05, 16.55], [18.18, 7.13]]
const DASH_PTS = [[6.48, 12], [17.53, 12]]

const boxes = [...document.querySelectorAll(".box svg")]
function applySeed(seed) {
	SEED = seed
	seedInput.value = seed
	seedShow.textContent = `SEED = ${seed}`
	for (const svg of boxes) {
		const rng = mulberry32(SEED)
		const rand = (a, b) => a + rng() * (b - a)
		weave(svg.querySelector(".cloth"), 14.8, 14.8, 3, 24 / 14.8, rand)
		// 勾/橫線掛同一個 clip:布的前緣推到哪,縫線就跟著一起進來
		svg.querySelector(".mark").setAttribute("clip-path", `url(#${weave.lastId})`)
		thread(svg.querySelector(".check"), CHECK_PTS, rand)
		thread(svg.querySelector(".dash"), DASH_PTS, rand)
	}
	try { location.replace(`#seed=${seed}`) } catch { /* 網址記不住就只顯示在畫面上 */ }
}
document.getElementById("reroll").addEventListener("click", () => {
	applySeed(1 + Math.floor(Math.random() * 99999))
})
seedInput.addEventListener("change", () => {
	const v = parseInt(seedInput.value, 10)
	if (v >= 1) applySeed(v)
})
document.getElementById("ind").indeterminate = true
applySeed(SEED)
</script>
</html>
