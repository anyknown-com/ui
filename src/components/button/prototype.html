<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>button — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.9rem;width:min(30rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
p.hint{font-size:.8rem;color:var(--muted);margin:0;max-width:30rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}

/* 織體按鈕:沒有 background — 底層粗暗紗保證無洞,面上細紗跟著共享波場
   起伏、交疊成緻密的布面。線層純裝飾,語意仍是 <button>。 */
.fiber{position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-height:2.4rem;padding:.45rem 1.1rem;border-radius:.5rem;border:none;background:none;
  font:500 .875rem/1.25 "Geist",system-ui,sans-serif;cursor:pointer}
.fiber:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.fiber svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.fiber path{fill:none;stroke-linecap:round}
.fiber .lbl{position:relative}

/* 每個 variant 一組紗線色:un 底紗、sh 縫隙陰影、0–4 本體(深→淺)、hi 挑面亮紗 */
.fiber.primary{color:var(--accent-text);
  --y-un:#194F40;--y-sh:#123C31;--y0:#1E6250;--y1:#216A55;--y2:#23705A;--y3:#28795F;--y4:#2E8266;--y-hi:#5CAA89;
  filter:drop-shadow(0 1px 1.5px rgba(18,60,49,.30))}
@media(prefers-color-scheme:dark){.fiber.primary{
  --y-un:#316B57;--y-sh:#1B4437;--y0:#3F8A70;--y1:#47957A;--y2:#4FA184;--y3:#56A98B;--y4:#5EB193;--y-hi:#8FD2B4;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}}
.fiber.secondary{color:var(--text);
  --y-un:#DBD7C8;--y-sh:#C9C4B4;--y0:#E4E0D3;--y1:#E8E5D9;--y2:#EDEAE0;--y3:#F1EEE6;--y4:#F5F3EC;--y-hi:#FFFFFF;
  filter:drop-shadow(0 1px 1.5px rgba(80,74,60,.22))}
@media(prefers-color-scheme:dark){.fiber.secondary{
  --y-un:#221E18;--y-sh:#15120E;--y0:#2B2620;--y1:#2F2A23;--y2:#332E26;--y3:#38322A;--y4:#3D372E;--y-hi:#5E5546;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}}
.fiber.ghost{color:var(--text);
  --y-un:transparent;--y-sh:transparent;--y0:#DCD8CA;--y1:#DFDBCE;--y2:#E3E0D5;--y3:#E7E4D9;--y4:#EBE8DE;--y-hi:#C8C3B4}
@media(prefers-color-scheme:dark){.fiber.ghost{
  --y-un:transparent;--y-sh:transparent;--y0:#2A251F;--y1:#2F2A23;--y2:#35302A;--y3:#39342D;--y4:#3E3830;--y-hi:#57503F}}

@media(prefers-reduced-motion:reduce){.fiber{transition:none}}
</style>

<h1>Button — 織成的實心</h1>
<p class="hint">沒有 background,按鈕是線織出來的。底層粗暗紗鋪滿(保證不透底),
面上的細紗(0.5–1.5px)跟著一片<b>共享的波場</b>起伏 — 相鄰紗一起走,像布的垂墜,
每條再帶自己的小顫和深淺差。細、密、完全覆蓋,但沒有一條線是直的。</p>

<section>
  <h2>hover — 三個 variant</h2>
  <div class="row">
    <button class="fiber primary" data-press="dent"><span class="lbl">開始上傳</span></button>
    <button class="fiber secondary" data-press="dent"><span class="lbl">取消</span></button>
    <button class="fiber ghost" data-press="dent"><span class="lbl">稍後再說</span></button>
  </div>
  <p class="hint">hover 一團柔光沿紗線游走;每次重新整理布都重織,紗路獨一無二。</p>
</section>

<section>
  <h2>press 方案 A — 壓痕(這排按按看)</h2>
  <div class="row">
    <button class="fiber primary" data-press="dent"><span class="lbl">刪除記憶</span></button>
    <button class="fiber secondary" data-press="dent"><span class="lbl">重新生成</span></button>
  </div>
  <p class="hint">按下 = 按點的紗沉暗成指印;放開 = 浮回來。</p>
</section>

<section>
  <h2>press 方案 B — 光環暈開(這排按按看)</h2>
  <div class="row">
    <button class="fiber primary" data-press="bloom"><span class="lbl">送出</span></button>
    <button class="fiber secondary" data-press="bloom"><span class="lbl">複製連結</span></button>
  </div>
  <p class="hint">放開時一圈細光沿著紗線暈開(SVG <code>&lt;animate&gt;</code>)。</p>
</section>

<script>
// 覆蓋靠兩件事保證:底層粗紗鋪滿 + 面紗用共享波場(相鄰紗同進退,
// divergence 不會超過線寬,不露縫)。生命力靠:波場本身是兩個不可通約
// 頻率的干涉、隨 y 緩慢換相,每條紗再疊自己的小顫、粗細與深淺個體差。
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches
const NS = "http://www.w3.org/2000/svg"
let uid = 0
const rand = (a, b) => a + Math.random() * (b - a)

function el(name, attrs, parent) {
	const node = document.createElementNS(NS, name)
	for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
	parent?.append(node)
	return node
}

class WovenBody {
	constructor(btn) {
		this.btn = btn
		this.mode = btn.dataset.press
		this.id = `wb${uid++}`
		this.svg = el("svg", { "aria-hidden": "true" }, null)
		btn.prepend(this.svg)
		this.pointer = null
		this.pressed = false
		this.gx = 0; this.gy = 0
		this.glow = 0; this.dent = 0
		this.raf = 0
		this.built = false
		this.build()
		new ResizeObserver(() => this.build()).observe(btn)
		btn.addEventListener("pointerenter", (e) => this.track(e, true))
		btn.addEventListener("pointermove", (e) => this.track(e))
		btn.addEventListener("pointerleave", () => { this.pointer = null; this.wake() })
		btn.addEventListener("pointerdown", (e) => { this.pressed = true; this.track(e); this.wake() })
		window.addEventListener("pointerup", () => this.release())
		btn.addEventListener("keydown", (e) => {
			if (e.key === " " || e.key === "Enter") {
				this.pointer = { x: this.w / 2, y: this.h / 2, speed: 0 }
				this.gx = this.w / 2; this.gy = this.h / 2
				this.pressed = true; this.wake()
			}
		})
		btn.addEventListener("keyup", () => this.release())
	}

	// 共享波場:整塊布一起呼吸的起伏。兩個頻率干涉,相位隨 y 緩慢滑移
	//(所以起伏斜斜地掃過布面,不是每一行都一樣)。
	makeField() {
		const A1 = rand(0.8, 1.3), W1 = rand(64, 118), P1 = rand(0, 6.28), K1 = rand(0.06, 0.14)
		const A2 = rand(0.35, 0.6), W2 = rand(24, 42), P2 = rand(0, 6.28), K2 = rand(0.16, 0.3)
		return (x, y) =>
			A1 * Math.sin((x / W1) * 6.283 + P1 + y * K1) +
			A2 * Math.sin((x / W2) * 6.283 + P2 + y * K2)
	}

	// 一條紗 = 波場 + 自己的小顫(短波長、小振幅);全部收在按鈕範圍內
	yarn(y0, own) {
		const a = rand(0.1, own), wl = rand(6.5, 15), ph = rand(0, 6.28)
		const x0 = 0, x1 = this.w
		let d = ""
		for (let x = x0; x <= x1; x += 2.5) {
			const y = y0 + this.field(x, y0) + a * Math.sin((x / wl) * 6.283 + ph)
			d += `${d ? "L" : "M"}${x.toFixed(1)},${y.toFixed(2)}`
		}
		return d
	}

	build() {
		const w = this.btn.clientWidth, h = this.btn.clientHeight
		if (w === 0 || (this.built && w === this.w && h === this.h)) return
		this.w = w; this.h = h; this.built = true
		this.field = this.makeField()
		this.svg.setAttribute("viewBox", `0 0 ${w} ${h}`)
		this.svg.replaceChildren()
		const defs = el("defs", {}, this.svg)
		el("clipPath", { id: `${this.id}-clip` }, defs)
			.append(el("rect", { x: 0, y: 0, width: w, height: h, rx: 8 }, null))
		const soft = el("radialGradient", { id: `${this.id}-soft` }, defs)
		el("stop", { offset: "0", "stop-color": "#fff", "stop-opacity": ".8" }, soft)
		el("stop", { offset: ".55", "stop-color": "#fff", "stop-opacity": ".35" }, soft)
		el("stop", { offset: "1", "stop-color": "#fff", "stop-opacity": "0" }, soft)
		const ring = el("radialGradient", { id: `${this.id}-ring` }, defs)
		el("stop", { offset: ".62", "stop-color": "#fff", "stop-opacity": "0" }, ring)
		el("stop", { offset: ".8", "stop-color": "#fff", "stop-opacity": ".7" }, ring)
		el("stop", { offset: "1", "stop-color": "#fff", "stop-opacity": "0" }, ring)
		const glowMask = el("mask", { id: `${this.id}-glow` }, defs)
		this.glowDot = el("circle", { r: 30, fill: `url(#${this.id}-soft)` }, glowMask)
		const dentMask = el("mask", { id: `${this.id}-dentm` }, defs)
		this.dentDot = el("circle", { r: 17, fill: `url(#${this.id}-soft)` }, dentMask)
		const ringMask = el("mask", { id: `${this.id}-ringm` }, defs)
		this.ringDot = el("circle", { r: 0, fill: `url(#${this.id}-ring)` }, ringMask)
		this.ringAnim = el("animate", {
			attributeName: "r", begin: "indefinite", fill: "freeze", dur: "480ms",
			calcMode: "spline", keySplines: "0.2 0.6 0.4 1", keyTimes: "0;1", values: `6;${w * 0.75}`,
		}, this.ringDot)

		const ghost = this.btn.classList.contains("ghost")
		const clip = { "clip-path": `url(#${this.id}-clip)` }
		const body = el("g", clip, this.svg)
		const yarns = []

		// 1. 底紗:粗、暗、密 — 先把布鋪滿,任何縫隙透出來的都是紗影不是底色
		if (!ghost) {
			const under = el("g", { stroke: "var(--y-un)" }, body)
			for (let y = 0; y < h + 2; y += 1.8)
				el("path", { d: this.yarn(y, 0.25), "stroke-width": "2.6" }, under)
		}
		// 2. 縫隙陰影:細暗紗夾在面紗之間,織紋的凹處
		if (!ghost) {
			const seams = el("g", { stroke: "var(--y-sh)", opacity: ".5" }, body)
			for (let y = 1.6; y < h + 1; y += 2.4)
				el("path", { d: this.yarn(y, 0.3), "stroke-width": rand(0.5, 0.8).toFixed(2) }, seams)
		}
		// 3. 面紗:細(0.6–1.4px)、密(≈1.2px 行距),跟著波場走;
		//    深度 + 個體差挑色,上淺下深的光感
		const pitch = ghost ? 2.1 : 1.2
		for (let y = 0.6; y < h + 1; y += pitch + rand(-0.15, 0.15)) {
			const depth = y / h
			const bucket = Math.min(4, Math.max(0, Math.round(4.2 - depth * 3 + rand(-0.9, 0.9))))
			const d = this.yarn(y, 0.4)
			const width = rand(0.6, ghost ? 1.0 : 1.4)
			yarns.push({ d, width })
			el("path", { d, "stroke-width": width.toFixed(2), stroke: `var(--y${bucket})` }, body)
		}
		// 4. 挑面亮紗:極細,布的高光絲
		const hiG = el("g", { stroke: "var(--y-hi)", opacity: ".45" }, body)
		for (let i = 0; i < (ghost ? 2 : 5); i++)
			el("path", { d: this.yarn(rand(2, h * 0.6), 0.3), "stroke-width": rand(0.4, 0.7).toFixed(2) }, hiG)

		// 光澤/壓痕/光環:抽 1/3 面紗重繪,mask 顯形
		const sample = yarns.filter((_, i) => i % 3 === 0)
		this.dentG = el("g", { ...clip, stroke: "var(--y-sh)", mask: `url(#${this.id}-dentm)`, opacity: 0 }, this.svg)
		for (const yn of sample) el("path", { d: yn.d, "stroke-width": yn.width + 0.3 }, this.dentG)
		this.sheenG = el("g", { ...clip, stroke: "var(--y-hi)", mask: `url(#${this.id}-glow)`, opacity: 0 }, this.svg)
		for (const yn of sample) el("path", { d: yn.d, "stroke-width": yn.width * 0.8, "stroke-opacity": ".55" }, this.sheenG)
		this.ringG = el("g", { ...clip, stroke: "var(--y-hi)", mask: `url(#${this.id}-ringm)`, opacity: 0 }, this.svg)
		for (const yn of sample) el("path", { d: yn.d, "stroke-width": yn.width * 0.7, "stroke-opacity": ".65" }, this.ringG)
	}

	track(e, enter) {
		const r = this.btn.getBoundingClientRect()
		const x = e.clientX - r.left, y = e.clientY - r.top
		const p = this.pointer
		const speed = p ? Math.hypot(x - p.x, y - p.y) : 0
		this.pointer = { x, y, speed: p ? p.speed * 0.6 + speed * 0.4 : 0 }
		if (enter) { this.gx = x; this.gy = y }
		this.wake()
	}

	release() {
		if (!this.pressed) return
		this.pressed = false
		if (this.mode === "bloom" && this.pointer != null && !REDUCED) {
			this.ringDot.setAttribute("cx", this.gx)
			this.ringDot.setAttribute("cy", this.gy)
			this.ringG.setAttribute("opacity", "1")
			this.ringStart = performance.now()
			this.ringAnim.beginElement()
		}
		this.wake()
	}

	tick(now) {
		const p = this.pointer
		if (p != null) {
			this.gx += (p.x - this.gx) * 0.22
			this.gy += (p.y - this.gy) * 0.22
			p.speed *= 0.92
		}
		const pressDent = this.pressed && this.mode === "dent"
		let glowT = 0
		if (p != null && !pressDent) glowT = Math.min(1, 0.45 + p.speed / 5)
		this.glow += (glowT - this.glow) * 0.14
		this.dent += ((pressDent ? 1 : 0) - this.dent) * 0.22
		this.glowDot.setAttribute("cx", this.gx.toFixed(1))
		this.glowDot.setAttribute("cy", this.gy.toFixed(1))
		this.glowDot.setAttribute("r", this.pressed && this.mode === "bloom" ? 10 : 30)
		this.dentDot.setAttribute("cx", this.gx.toFixed(1))
		this.dentDot.setAttribute("cy", this.gy.toFixed(1))
		this.sheenG.setAttribute("opacity", this.glow.toFixed(3))
		this.dentG.setAttribute("opacity", (this.dent * 0.9).toFixed(3))
		if (this.ringStart != null) {
			const age = now - this.ringStart
			this.ringG.setAttribute("opacity", Math.max(0, 1 - age / 480).toFixed(3))
			if (age > 500) { this.ringStart = null; this.ringG.setAttribute("opacity", "0") }
		}
		const active = p != null || this.pressed || this.ringStart != null ||
			this.glow > 0.005 || this.dent > 0.005
		this.raf = active ? requestAnimationFrame((n) => this.tick(n)) : 0
	}

	wake() { if (!this.raf && !REDUCED && this.built) this.raf = requestAnimationFrame((n) => this.tick(n)) }
}

for (const btn of document.querySelectorAll(".fiber")) new WovenBody(btn)
</script>
</html>
