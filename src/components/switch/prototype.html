<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>switch — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.9rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
p.hint{font-size:.8rem;color:var(--muted);margin:0;max-width:24rem}
.seedbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.seedbar button,.seedbar input{font:500 .8rem/1.2 "Geist",system-ui,sans-serif;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:.4rem;padding:.35rem .7rem}
.seedbar button{cursor:pointer}
.seedbar input{width:6.5rem}
.seedbar label{display:inline-flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--muted)}
.seedbar code{font:600 .8rem/1 "Geist Mono",ui-monospace,monospace;color:var(--accent)}

/* off:空心線頭 + 預繪的灰色路徑(toggle 是固定、單向、確定的移動)
   on:thumb 滑到底,軌道織成一塊真正的布 — TEXTURE-GUIDE 的紗線堆疊,
   primary 色票,固定種子,無 background,實心由紗織成。 */
.sw{display:flex;gap:.75rem;align-items:flex-start;cursor:pointer;justify-content:space-between}
.sw input{position:absolute;opacity:0;width:2.75rem;height:1.4rem;margin:0;cursor:pointer}
.track{flex:none;width:2.75rem;height:1.4rem;margin-top:.1rem}
.track svg{width:100%;height:100%;display:block;overflow:visible}
.track path{fill:none;stroke-linecap:round}
.guide{stroke:var(--border-strong);stroke-width:1.5;fill:none}
/* 紗線色(primary,抄 button prototype) */
.track{--y-un:#11362C;--y-sh:#123C31;--y0:#1E6250;--y1:#216A55;--y2:#23705A;--y3:#28795F;--y4:#2E8266;--y-hi:#5CAA89}
.cloth{filter:drop-shadow(0 1px 1.5px rgba(18,60,49,.30))}
@media(prefers-color-scheme:dark){
  .track{--y-un:#173629;--y-sh:#1B4437;--y0:#3F8A70;--y1:#47957A;--y2:#4FA184;--y3:#56A98B;--y4:#5EB193;--y-hi:#8FD2B4}
  .cloth{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}}
/* 開:布從左織進來(clip 的 width 推進,紗本身不動 — 同一塊布被逐漸織出);
   關:整塊布 scale 到 0 收掉,width/opacity 等 scale 跑完才歸零 */
.cloth{opacity:0;scale:0;transform-box:fill-box;transform-origin:center;transition:scale 200ms ease-in,opacity 0s 200ms}
.pillclip{width:0;transition:width 0s 200ms}
.sw input:checked~.track .cloth{opacity:1;scale:1;transition:scale 0s,opacity 0s}
.sw input:checked~.track .pillclip{width:42px;transition:width 240ms cubic-bezier(.32,.85,.45,1)}
.thumb{fill:var(--bg);stroke:var(--border-strong);stroke-width:1.6;transition:translate 240ms cubic-bezier(.16,1,.3,1),stroke 160ms,fill 160ms}
.sw input:checked~.track .thumb{translate:22px 0;fill:var(--surface);stroke:var(--accent)}
.sw input:focus-visible~.track{outline:2px solid var(--focus);outline-offset:3px;border-radius:999px}
.sw:has(input:disabled){opacity:.5;cursor:not-allowed}
.sw b{font-weight:500;font-size:.9rem;display:block}
.sw small{font-size:.8rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.cloth,.pillclip,.thumb{transition:none}}
</style>
<h1>Switch — 線頭與織成的軌道</h1>
<p class="hint">關 = 一顆空心線頭停在預繪的灰色路徑起點;開 = 線頭沿固定路徑滑到底,
軌道織成一塊布 — 織法與 button 同源(固定種子 10075,同尺寸每次渲染都是同一塊布)。
選取控件保持安靜:沒有窩、沒有掃光,動態只有「布織入」本身。</p>

<section>
  <h2>織法種子</h2>
  <div class="seedbar">
    <button type="button" id="reroll">🎲 重織</button>
    <label>seed <input id="seedInput" type="number" min="1" step="1"></label>
    <code id="seedShow"></code>
  </div>
</section>

<section>
  <h2>基本</h2>
  <label class="sw"><span><b>語音喚醒</b><small>說「Anyknown」開始對話。</small></span><input type="checkbox" role="switch" checked><span class="track"><svg viewBox="0 0 44 22" aria-hidden="true"><path class="guide" d="M11,11 H33"/><g class="cloth"></g><circle class="thumb" cx="11" cy="11" r="8.4"/></svg></span></label>
  <label class="sw"><span><b>開機自動啟動</b></span><input type="checkbox" role="switch"><span class="track"><svg viewBox="0 0 44 22" aria-hidden="true"><path class="guide" d="M11,11 H33"/><g class="cloth"></g><circle class="thumb" cx="11" cy="11" r="8.4"/></svg></span></label>
</section>

<section>
  <h2>disabled</h2>
  <label class="sw"><span><b>本地儲存</b><small>永遠開啟,資料不離開這台電腦。</small></span><input type="checkbox" role="switch" checked disabled><span class="track"><svg viewBox="0 0 44 22" aria-hidden="true"><path class="guide" d="M11,11 H33"/><g class="cloth"></g><circle class="thumb" cx="11" cy="11" r="8.4"/></svg></span></label>
</section>

<script>
// 幾何抄 TEXTURE-GUIDE §3:mulberry32 固定種子 + 兩支長波共享波場 + 四層紗。
// 藥丸 42×20(1:1 CSS px),clip rx 10(藥丸圓角),紗超畫左右 4px 由 clip 裁形。
// 靜態織紋,無 rAF — 動態只有 CSS 的織入/thumb。
const NS = "http://www.w3.org/2000/svg"
let uid = 0
let SEED = (() => {
	const m = location.hash.match(/seed=(\d+)/)
	return m ? parseInt(m[1], 10) : 10075
})()

function mulberry32(seed) {
	let a = seed >>> 0
	return () => {
		a |= 0; a = (a + 0x6D2B79F5) | 0
		let t = Math.imul(a ^ (a >>> 15), 1 | a)
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296
	}
}

function el(name, attrs, parent) {
	const node = document.createElementNS(NS, name)
	for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
	parent?.append(node)
	return node
}

// 織一塊 w×h 的布進 cloth(座標平移 ox,oy;s = viewBox 對 CSS px 的縮放)
function weave(cloth, w, h, ox, oy, rx, s) {
	cloth.replaceChildren()
	const id = `swc${uid++}`
	const rng = mulberry32(SEED)
	const rand = (a, b) => a + rng() * (b - a)
	const W1 = rand(Math.max(120, w * 0.9), w * 1.8)
	const A1 = rand(1.0, 1.8), P1 = rand(0, 6.28), K1 = rand(0.05, 0.11)
	const W2 = rand(w * 1.6, w * 3)
	const A2 = rand(0.5, 0.9), P2 = rand(0, 6.28), K2 = rand(0.03, 0.07)
	const field = (x, y) =>
		A1 * Math.sin((x / W1) * 6.283 + P1 + y * K1) +
		A2 * Math.sin((x / W2) * 6.283 + P2 + y * K2)
	const staticD = (y0) => {
		let d = ""
		for (let x = -4; x <= w + 4; x += 4)
			d += `${d ? "L" : "M"}${((ox + x) * s).toFixed(2)},${((oy + y0 + field(x, y0)) * s).toFixed(2)}`
		return d
	}
	const defs = el("defs", {}, cloth)
	// 藥丸形狀固定(圓角從第一幀就完整),織入用另一支無圓角的 wipe 前緣推進 —
	// 兩層 clip 相交:左圓角永遠是藥丸的左圓角,前緣是織布機的直線 fell
	el("clipPath", { id: `${id}p` }, defs)
		.append(el("rect", { x: ox * s, y: oy * s, width: w * s, height: h * s, rx: rx * s }, null))
	el("clipPath", { id }, defs)
		.append(el("rect", { class: "pillclip", x: ox * s, y: (oy - 4) * s, height: (h + 8) * s }, null))
	const pill = el("g", { "clip-path": `url(#${id}p)` }, cloth)
	const body = el("g", { "clip-path": `url(#${id})` }, pill)
	const under = el("g", { stroke: "var(--y-un)" }, body)
	for (let y = -0.8; y < h + 2.6; y += 1.5)
		el("path", { d: staticD(y), "stroke-width": (3.4 * s).toFixed(2) }, under)
	const seams = el("g", { stroke: "var(--y-sh)", opacity: ".5" }, body)
	for (let y = 1.6; y < h + 1; y += 2.4)
		el("path", { d: staticD(y), "stroke-width": (rand(0.5, 0.8) * s).toFixed(2) }, seams)
	for (let y = 0.6; y < h + 1; y += 1.2 + rand(-0.15, 0.15)) {
		const bucket = Math.min(4, Math.max(0, Math.round(4.2 - (y / h) * 3 + rand(-0.9, 0.9))))
		el("path", { d: staticD(y), "stroke-width": (rand(0.6, 1.4) * s).toFixed(2), stroke: `var(--y${bucket})` }, body)
	}
	const hi = el("g", { stroke: "var(--y-hi)", opacity: ".45" }, body)
	for (let i = 0; i < 4; i++) {
		const y = rand(2, h * 0.6)
		el("path", { d: staticD(y), "stroke-width": (rand(0.4, 0.7) * s).toFixed(2) }, hi)
	}
}

const cloths = [...document.querySelectorAll(".cloth")]
function applySeed(seed) {
	SEED = seed
	seedInput.value = seed
	seedShow.textContent = `SEED = ${seed}`
	for (const cloth of cloths) weave(cloth, 42, 20, 1, 1, 10, 1)
	try { location.replace(`#seed=${seed}`) } catch { /* 網址記不住就只顯示在畫面上 */ }
}
document.getElementById("reroll").addEventListener("click", () => {
	applySeed(1 + Math.floor(Math.random() * 99999))
})
seedInput.addEventListener("change", () => {
	const v = parseInt(seedInput.value, 10)
	if (v >= 1) applySeed(v)
})
applySeed(SEED)
</script>
</html>
