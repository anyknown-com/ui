<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tooltip — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.6rem;justify-content:center;align-content:start}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{font:500 .875rem/1 "Geist",system-ui,sans-serif;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);padding:.55rem .9rem;cursor:pointer;transition:border-color 120ms}
.btn:hover{border-color:var(--border-strong)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tip{position:relative;display:inline-block}
.bubble{position:absolute;z-index:20;white-space:nowrap;background:var(--text);color:var(--bg);border-radius:.4rem;padding:.32rem .55rem;font-size:.75rem;line-height:1.35;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 120ms,visibility 0s 120ms}
.tip:hover .bubble,.tip:has(:focus-visible) .bubble{opacity:1;visibility:visible;transition-delay:400ms}
.tip[data-side="top"] .bubble{bottom:calc(100% + 6px);left:50%;translate:-50% 0}
.tip[data-side="bottom"] .bubble{top:calc(100% + 6px);left:50%;translate:-50% 0}
.tip[data-side="left"] .bubble{right:calc(100% + 6px);top:50%;translate:0 -50%}
.tip[data-side="right"] .bubble{left:calc(100% + 6px);top:50%;translate:0 -50%}
kbd{font:500 .68rem/1 "Geist Mono",ui-monospace,monospace;background:rgba(255,255,255,.18);border-radius:.25rem;padding:.14rem .3rem;margin-left:.35rem}
@media(prefers-color-scheme:dark){kbd{background:rgba(0,0,0,.28)}}
@media(prefers-reduced-motion:reduce){.bubble{transition:none}.tip:hover .bubble,.tip:has(:focus-visible) .bubble{transition-delay:0s}}
</style>
<h1>Tooltip</h1>

<section>
  <h2>placement × 4(hover 或 tab 到按鈕,延遲 400ms)</h2>
  <div class="row" style="padding:2.5rem 0">
    <span class="tip" data-side="top">
      <button class="btn" aria-describedby="tt-top">top</button>
      <span class="bubble" id="tt-top" role="tooltip">釘選這則記憶</span>
    </span>
    <span class="tip" data-side="bottom">
      <button class="btn" aria-describedby="tt-bottom">bottom</button>
      <span class="bubble" id="tt-bottom" role="tooltip">封存 thread</span>
    </span>
    <span class="tip" data-side="left">
      <button class="btn" aria-describedby="tt-left">left</button>
      <span class="bubble" id="tt-left" role="tooltip">回到工作區</span>
    </span>
    <span class="tip" data-side="right">
      <button class="btn" aria-describedby="tt-right">right</button>
      <span class="bubble" id="tt-right" role="tooltip">打開 vault</span>
    </span>
  </div>
</section>

<section>
  <h2>with kbd shortcut</h2>
  <div class="row" style="padding:2.5rem 0 .5rem">
    <span class="tip" data-side="top">
      <button class="btn" aria-describedby="tt-kbd">開始換班</button>
      <span class="bubble" id="tt-kbd" role="tooltip">產生交接摘要<kbd>⌘⇧H</kbd></span>
    </span>
    <span class="tip" data-side="top">
      <button class="btn" aria-describedby="tt-kbd2">新 thread</button>
      <span class="bubble" id="tt-kbd2" role="tooltip">開新對話<kbd>⌘N</kbd></span>
    </span>
  </div>
</section>
</html>
