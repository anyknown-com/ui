<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kbd — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(28rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
kbd{display:inline-grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .3rem;background:var(--surface);border:1px solid var(--border);border-bottom-color:var(--border-strong);border-radius:.3rem;box-shadow:0 1px 0 var(--border-strong);font:500 .72rem/1 "Geist Mono",ui-monospace,monospace;color:var(--muted)}
.combo{display:inline-flex;gap:.2rem;align-items:center}
.seq{display:inline-flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--faint)}
.row{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center}
p{margin:0;font-size:.875rem;color:var(--muted)}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:2rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;width:fit-content}
.tip{background:var(--text);color:var(--bg);border-radius:.4rem;padding:.35rem .6rem;font-size:.78rem;display:inline-flex;gap:.5rem;align-items:center;width:fit-content}
.tip kbd{background:color-mix(in srgb,var(--bg) 16%,transparent);border-color:color-mix(in srgb,var(--bg) 28%,transparent);border-bottom-color:color-mix(in srgb,var(--bg) 28%,transparent);box-shadow:none;color:var(--bg)}
</style>
<h1>Kbd</h1>

<section>
  <h2>單鍵</h2>
  <div class="row"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>Esc</kbd><kbd>Enter</kbd><kbd>/</kbd></div>
</section>

<section>
  <h2>組合鍵</h2>
  <div class="row">
    <span class="combo"><kbd>⌘</kbd><kbd>N</kbd></span>
    <span class="combo"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>P</kbd></span>
    <span class="combo"><kbd>⌘</kbd><kbd>K</kbd></span>
  </div>
</section>

<section>
  <h2>序列(先後按)</h2>
  <span class="seq"><kbd>g</kbd>然後<kbd>t</kbd><span>— 跳到 thread 列表</span></span>
</section>

<section>
  <h2>句子內</h2>
  <p>換班前按 <kbd>⌘</kbd><kbd>⇧</kbd><kbd>H</kbd> 可以先預覽要交接的記憶。</p>
</section>

<section>
  <h2>menu item 內(靠右對齊)</h2>
  <div class="menu-item"><span>新增 thread</span><span class="combo"><kbd>⌘</kbd><kbd>N</kbd></span></div>
</section>

<section>
  <h2>tooltip 內(反白底,kbd 改半透明)</h2>
  <span class="tip">搜尋工作區<span class="combo"><kbd>⌘</kbd><kbd>K</kbd></span></span>
</section>
</html>
