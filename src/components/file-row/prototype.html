<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>file-row — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.4rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.6rem;width:min(34rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
.help{font-size:.8rem;color:var(--muted);margin:0}
.list{border:1px solid var(--border);border-radius:.6rem;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:2rem 1.5rem minmax(0,1fr) 5.5rem 6.5rem 4.6rem;align-items:center;gap:.4rem;height:2.6rem;padding:0 .4rem;border-bottom:1px solid var(--border);font-size:.85rem;cursor:default;user-select:none}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-subtle)}
.row[data-selected]{background:var(--accent-subtle)}
.row .check{justify-self:center;width:1rem;height:1rem;margin:0;accent-color:var(--accent);opacity:0}
.row:hover .check,.row[data-selected] .check,.row .check:focus-visible{opacity:1}
.row .icon{color:var(--muted)}
.row .icon.folder{color:var(--accent)}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .size{font:400 .78rem/1 "Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.row .mtime{font-size:.78rem;color:var(--muted)}
.row .acts{display:flex;justify-content:end;gap:.15rem;opacity:0}
.row:hover .acts,.row[data-selected] .acts,.row .acts:focus-within{opacity:1}
.acts button{all:unset;cursor:pointer;width:1.6rem;height:1.6rem;display:grid;place-items:center;border-radius:.35rem;color:var(--muted)}
.acts button:hover{background:var(--surface);color:var(--text)}
.acts button:focus-visible{outline:2px solid var(--focus)}
.row[data-busy]{color:var(--muted);cursor:progress}
.row[data-busy] .st{grid-column:4/7;display:flex;align-items:center;gap:.5rem;font-size:.75rem}
.row[data-busy] .track{flex:1;height:.2rem;border-radius:99px;background:var(--border);overflow:hidden}
.row[data-busy] .track b{display:block;height:100%;width:45%;background:var(--accent)}
.row[data-busy] .spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{rotate:360deg}}
.count{font-size:.78rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.row .spin{animation:none}}
</style>
<h1>File row</h1>

<section>
  <h2>list — hover 顯示 checkbox 與動作,點列選取</h2>
  <div class="list" role="grid" aria-label="檔案" id="list">
    <div class="row" role="row" data-kind="folder" tabindex="0" aria-selected="false">
      <input class="check" type="checkbox" aria-label="選取 稅務文件">
      <svg class="icon folder" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      <span class="name">稅務文件</span>
      <span class="size">—</span>
      <span class="mtime">8月20日</span>
      <span class="acts">
        <button aria-label="改名 稅務文件"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></svg></button>
        <button aria-label="刪除 稅務文件"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </span>
    </div>
    <div class="row" role="row" tabindex="0" aria-selected="false">
      <input class="check" type="checkbox" aria-label="選取 護照掃描.pdf">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
      <span class="name">護照掃描.pdf</span>
      <span class="size">2.4 MB</span>
      <span class="mtime">8月26日</span>
      <span class="acts">
        <button aria-label="下載 護照掃描.pdf"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg></button>
        <button aria-label="改名 護照掃描.pdf"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></svg></button>
        <button aria-label="刪除 護照掃描.pdf"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </span>
    </div>
    <div class="row" role="row" tabindex="0" aria-selected="false">
      <input class="check" type="checkbox" aria-label="選取 全家合照-2025.jpg">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
      <span class="name">全家合照-2025.jpg</span>
      <span class="size">11.8 MB</span>
      <span class="mtime">8月12日</span>
      <span class="acts">
        <button aria-label="下載 全家合照-2025.jpg"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg></button>
        <button aria-label="改名 全家合照-2025.jpg"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></svg></button>
        <button aria-label="刪除 全家合照-2025.jpg"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </span>
    </div>
  </div>
  <p class="count" aria-live="polite" id="count"></p>
</section>

<section>
  <h2>busy states — 加密中 / 上傳中(無動作)</h2>
  <div class="list">
    <div class="row" data-busy aria-busy="true">
      <span></span>
      <svg class="icon spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>
      <span class="name">遺囑草稿.docx</span>
      <span class="st"><span>加密中…</span></span>
    </div>
    <div class="row" data-busy aria-busy="true">
      <span></span>
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16.2A4.5 4.5 0 0 1 6.6 8a6 6 0 0 1 11.6 1.6A4 4 0 0 1 18 17"/><path d="M12 12v9m0-9 3.5 3.5M12 12l-3.5 3.5"/></svg>
      <span class="name">保單-2026.pdf</span>
      <span class="st"><span>上傳中</span><span class="track"><b></b></span><span style="font-variant-numeric:tabular-nums">45%</span></span>
    </div>
  </div>
</section>

<script>
const rows = [...document.querySelectorAll("#list .row")]
const count = document.getElementById("count")

function setSel(row, on) {
  row.toggleAttribute("data-selected", on)
  row.setAttribute("aria-selected", on)
  row.querySelector(".check").checked = on
  const n = rows.filter(r => r.hasAttribute("data-selected")).length
  count.textContent = n ? `已選 ${n} 個項目` : ""
}

for (const row of rows) {
  const check = row.querySelector(".check")
  check.addEventListener("click", e => e.stopPropagation())
  check.addEventListener("change", () => setSel(row, check.checked))
  row.addEventListener("click", e => {
    if (e.target.closest(".acts")) return
    setSel(row, !row.hasAttribute("data-selected"))
  })
  row.addEventListener("keydown", e => {
    if (e.key === " " ) { e.preventDefault(); setSel(row, !row.hasAttribute("data-selected")) }
  })
  row.addEventListener("dblclick", () => {
    if (row.dataset.kind === "folder") alert("(demo)開啟資料夾")
  })
  for (const b of row.querySelectorAll(".acts button"))
    b.addEventListener("click", e => { e.stopPropagation(); alert(`(demo)${b.getAttribute("aria-label")}`) })
}
</script>
</html>
