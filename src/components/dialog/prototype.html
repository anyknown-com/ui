<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dialog — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.4rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(24rem,100%);justify-items:start}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
.btn{font:500 .875rem/1 "Geist",system-ui,sans-serif;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);padding:.55rem .9rem;cursor:pointer;transition:border-color 120ms}
.btn:hover{border-color:var(--border-strong)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#FFF}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:.75rem;box-shadow:var(--shadow);padding:1.25rem;width:min(24rem,calc(100vw - 2rem))}
dialog[open]{animation:in 160ms ease-out}
dialog::backdrop{background:rgba(24,22,19,.35);backdrop-filter:blur(2px)}
@keyframes in{from{opacity:0;scale:.96}}
dialog h3{font:500 1.15rem/1.3 "Newsreader",Georgia,serif;margin:0 0 .4rem}
dialog p{font-size:.875rem;color:var(--muted);margin:0 0 1.1rem}
dialog b{color:var(--text);font-weight:500}
.actions{display:flex;justify-content:flex-end;gap:.5rem}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
</style>
<h1>Dialog</h1>

<section>
  <h2>default</h2>
  <button class="btn" data-open="dlg-rename">重新命名工作區</button>
  <dialog id="dlg-rename" aria-labelledby="dlg-rename-title">
    <h3 id="dlg-rename-title">重新命名工作區</h3>
    <p>新名稱會同步到所有成員的側欄與 vault 路徑。</p>
    <div class="actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" data-close>儲存</button>
    </div>
  </dialog>
</section>

<section>
  <h2>confirm — danger</h2>
  <button class="btn" data-open="dlg-delete">刪除記憶</button>
  <dialog id="dlg-delete" aria-labelledby="dlg-delete-title">
    <h3 id="dlg-delete-title">刪除這則記憶?</h3>
    <p>「<b>部署走 Cloudflare</b>」會從工作區移除,之後的換班交接不會再帶上它。此動作無法復原。</p>
    <div class="actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn danger" data-close>刪除</button>
    </div>
  </dialog>
</section>

<script>
for (const btn of document.querySelectorAll("[data-open]"))
  btn.addEventListener("click", () => document.getElementById(btn.dataset.open).showModal())

for (const dlg of document.querySelectorAll("dialog")) {
  for (const btn of dlg.querySelectorAll("[data-close]"))
    btn.addEventListener("click", () => dlg.close())
  // backdrop 點擊關閉:click 落在 dialog 本身(而非其內容)即視為 backdrop
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close() })
}
</script>
</html>
