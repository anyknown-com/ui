<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>password-input — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1);--warn:#8A6116;--warn-subtle:#F5EDD8}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4);--warn:#D3A94E;--warn-subtle:#332B1A}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.4rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(24rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
label{font:500 .875rem/1.3 "Geist";display:block}
.help{font-size:.8rem;color:var(--muted);margin:0}
.error-msg{font-size:.8rem;color:var(--danger);margin:0}
.field{position:relative}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);font:inherit;font-size:.9rem;padding:.5rem 2.4rem .5rem .75rem;min-height:2.25rem;transition:border-color 120ms}
.input::placeholder{color:var(--faint)}
.input:hover{border-color:var(--border-strong)}
.input:focus-visible{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input[aria-invalid="true"]:focus-visible{outline-color:var(--danger)}
.toggle{all:unset;position:absolute;right:.35rem;top:50%;translate:0 -50%;display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:.4rem;color:var(--muted);cursor:pointer}
.toggle:hover{background:var(--accent-subtle)}
.toggle:focus-visible{outline:2px solid var(--focus)}
.toggle .eye-off{display:none}
.toggle[aria-pressed="true"] .eye{display:none}
.toggle[aria-pressed="true"] .eye-off{display:block}
.meter{display:grid;gap:.3rem}
.meter .bars{display:flex;gap:.25rem}
.meter .bars i{height:.25rem;flex:1;border-radius:99px;background:var(--border);transition:background 160ms}
.meter[data-level="1"] i:nth-child(-n+1){background:var(--danger)}
.meter[data-level="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-level="3"] i:nth-child(-n+3){background:var(--accent)}
.meter[data-level="4"] i{background:var(--accent)}
.meter .lbl{font-size:.8rem;color:var(--muted);min-height:1.2em}
.meter[data-level="1"] .lbl{color:var(--danger)}
.caps{display:none;align-items:center;gap:.45rem;background:var(--warn-subtle);color:var(--warn);border-radius:.45rem;padding:.4rem .6rem;font-size:.8rem}
.caps[data-on]{display:flex}
@media(prefers-reduced-motion:reduce){.input,.meter .bars i{transition:none}}
</style>
<h1>Password input</h1>

<section>
  <h2>passphrase + 強度計(輸入試試)</h2>
  <label for="pp">Vault passphrase</label>
  <div class="field">
    <input class="input" id="pp" type="password" autocomplete="new-password" placeholder="至少 12 個字元" aria-describedby="pp-meter pp-caps">
    <button class="toggle" type="button" aria-label="顯示 passphrase" aria-pressed="false">
      <svg class="eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7c1.8 0 3.4.5 4.7 1.3M22 12s-3.5 7-10 7c-1.8 0-3.4-.5-4.7-1.3M3 3l18 18"/></svg>
    </button>
  </div>
  <div class="meter" id="pp-meter" data-level="0">
    <div class="bars" aria-hidden><i></i><i></i><i></i><i></i></div>
    <p class="lbl" aria-live="polite">passphrase 無法找回,忘了就只能靠復原金鑰。</p>
  </div>
  <p class="caps" id="pp-caps" role="status"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 10v4m0 3h.01"/></svg>Caps Lock 開著。</p>
</section>

<section>
  <h2>confirm — 不一致錯誤(輸入不同內容試試)</h2>
  <label for="cf">再輸入一次 passphrase</label>
  <div class="field">
    <input class="input" id="cf" type="password" autocomplete="new-password" aria-describedby="cf-err">
    <button class="toggle" type="button" aria-label="顯示 passphrase" aria-pressed="false">
      <svg class="eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7c1.8 0 3.4.5 4.7 1.3M22 12s-3.5 7-10 7c-1.8 0-3.4-.5-4.7-1.3M3 3l18 18"/></svg>
    </button>
  </div>
  <p class="error-msg" id="cf-err" hidden>兩次輸入的 passphrase 不一樣。</p>
</section>

<section>
  <h2>disabled</h2>
  <div class="field">
    <input class="input" type="password" value="············" disabled style="opacity:.5;cursor:not-allowed">
  </div>
</section>

<script>
for (const btn of document.querySelectorAll(".toggle")) {
  btn.addEventListener("click", () => {
    const input = btn.parentElement.querySelector("input")
    const show = input.type === "password"
    input.type = show ? "text" : "password"
    btn.setAttribute("aria-pressed", show)
    btn.setAttribute("aria-label", show ? "隱藏 passphrase" : "顯示 passphrase")
    input.focus()
  })
}

// 簡易評分:長度 + 字元類別。真正實作交給 zxcvbn 類的估算器。
const LABELS = ["passphrase 無法找回,忘了就只能靠復原金鑰。", "弱 — 再長一點。", "可 — 建議混入更多種字元。", "強", "很強"]
function score(v) {
  if (!v) return 0
  let classes = 0
  for (const re of [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/]) if (re.test(v)) classes++
  if (v.length < 8) return 1
  if (v.length < 12) return classes >= 3 ? 2 : 1
  if (v.length < 20) return classes >= 3 ? 3 : 2
  return classes >= 2 ? 4 : 3
}

const pp = document.getElementById("pp")
const meter = document.getElementById("pp-meter")
pp.addEventListener("input", () => {
  const s = score(pp.value)
  meter.dataset.level = s
  meter.querySelector(".lbl").textContent = LABELS[s]
  check()
})

// Caps Lock 警告(需要按鍵事件才能讀 modifier state)
const caps = document.getElementById("pp-caps")
for (const ev of ["keydown", "keyup"]) pp.addEventListener(ev, e => {
  if (typeof e.getModifierState !== "function") return
  caps.toggleAttribute("data-on", e.getModifierState("CapsLock"))
})
pp.addEventListener("blur", () => caps.removeAttribute("data-on"))

const cf = document.getElementById("cf")
const err = document.getElementById("cf-err")
function check() {
  const bad = cf.value.length > 0 && cf.value !== pp.value
  err.hidden = !bad
  if (bad) cf.setAttribute("aria-invalid", "true"); else cf.removeAttribute("aria-invalid")
}
cf.addEventListener("input", check)
</script>
</html>
