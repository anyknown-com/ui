<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>badge — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--danger:#B3402E;--danger-subtle:#F6E7E3;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--danger:#DD7059;--danger-subtle:#3A241F;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(28rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:.35rem;font:500 .75rem/1 "Geist";padding:.3rem .55rem;border-radius:999px;border:1px solid transparent}
.badge.neutral{background:var(--surface);border-color:var(--border);color:var(--muted)}
.badge.accent{background:var(--accent-subtle);color:var(--accent)}
.badge.success{background:var(--accent);color:var(--bg)}
.badge.danger{background:var(--danger-subtle);color:var(--danger)}
.badge.outline{border-color:var(--border-strong);color:var(--text)}
.badge .dot{width:.4rem;height:.4rem;border-radius:999px;background:currentColor;flex:none}
.badge .count{font:600 .7rem/1 "Geist Mono",ui-monospace,monospace}
.badge.mono{font:500 .72rem/1 "Geist Mono",ui-monospace,monospace;background:var(--surface);border-color:var(--border);color:var(--muted);letter-spacing:.02em}
.chip-x{all:unset;display:grid;place-items:center;width:1rem;height:1rem;margin-right:-.2rem;border-radius:999px;cursor:pointer;color:inherit;opacity:.6}
.chip-x:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
.chip-x:focus-visible{outline:2px solid var(--focus);outline-offset:1px;opacity:1}
</style>
<h1>Badge / Chip</h1>

<section>
  <h2>variants</h2>
  <div class="row">
    <span class="badge neutral">草稿</span>
    <span class="badge accent">進行中</span>
    <span class="badge success">已交接</span>
    <span class="badge danger">已中斷</span>
    <span class="badge outline">唯讀</span>
  </div>
</section>

<section>
  <h2>count chip(等你回覆的 thread)</h2>
  <div class="row">
    <span class="badge accent">等你 · <span class="count">3</span></span>
    <span class="badge neutral">已讀 · <span class="count">12</span></span>
  </div>
</section>

<section>
  <h2>removable chip(篩選條件)</h2>
  <div class="row">
    <span class="badge outline">工作區:anyknown<button class="chip-x" aria-label="移除篩選:工作區 anyknown">×</button></span>
    <span class="badge outline">本週<button class="chip-x" aria-label="移除篩選:本週">×</button></span>
  </div>
</section>

<section>
  <h2>dot 狀態</h2>
  <div class="row">
    <span class="badge neutral"><span class="dot" style="color:var(--accent)"></span>Fable 在線</span>
    <span class="badge neutral"><span class="dot" style="color:var(--faint)"></span>換班中</span>
    <span class="badge neutral"><span class="dot" style="color:var(--danger)"></span>連線中斷</span>
  </div>
</section>

<section>
  <h2>mono token 計數(context 用量)</h2>
  <div class="row">
    <span class="badge mono">128k · 42%</span>
    <span class="badge mono">8.2k tokens</span>
  </div>
</section>
</html>
