<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>popover — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-text:#FCFCF9;--accent-subtle:#E7F0EB;--danger:#B3402E;--focus:#23705A;--shadow:0 8px 24px rgba(35,33,29,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-text:#14120F;--accent-subtle:#22352E;--danger:#DD7059;--focus:#4FA184;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem 16rem;display:grid;gap:2.6rem;justify-content:center;align-content:start}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.5rem;width:min(26rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;padding:5rem 0}
.btn{font:500 .875rem/1 "Geist",system-ui,sans-serif;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;color:var(--text);padding:.55rem .9rem;cursor:pointer;transition:border-color 120ms}
.btn:hover{border-color:var(--border-strong)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn[aria-expanded="true"]{border-color:var(--border-strong);background:var(--accent-subtle)}
.pop-root{position:relative;display:inline-block}
.pop{position:absolute;z-index:10;min-width:11rem;background:var(--surface);border:1px solid var(--border);border-radius:.6rem;box-shadow:var(--shadow);padding:.85rem;font-size:.85rem;animation:in 140ms ease-out}
.pop[hidden]{display:none}
@keyframes in{from{opacity:0;scale:.96}}
.pop[data-side="top"]{bottom:calc(100% + 8px);left:50%;translate:-50% 0;transform-origin:bottom}
.pop[data-side="bottom"]{top:calc(100% + 8px);left:50%;translate:-50% 0;transform-origin:top}
.pop[data-side="left"]{right:calc(100% + 8px);top:50%;translate:0 -50%;transform-origin:right}
.pop[data-side="right"]{left:calc(100% + 8px);top:50%;translate:0 -50%;transform-origin:left}
.pop h3{font:500 1rem/1.3 "Newsreader",Georgia,serif;margin:0 0 .25rem}
.pop .meta{font:500 .68rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:.5rem}
.pop p{color:var(--muted);margin:0 0 .8rem}
.pop .actions{display:flex;gap:.5rem}
.pop .actions .btn{font-size:.8rem;padding:.4rem .7rem}
.pop .actions .danger{color:var(--danger)}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
<h1>Popover</h1>

<section>
  <h2>placement × 4(transform-origin 依方向)</h2>
  <div class="row">
    <span class="pop-root"><button class="btn" aria-expanded="false" data-pop>top</button><div class="pop" data-side="top" hidden>從 trigger 上緣長出。</div></span>
    <span class="pop-root"><button class="btn" aria-expanded="false" data-pop>bottom</button><div class="pop" data-side="bottom" hidden>從 trigger 下緣長出。</div></span>
    <span class="pop-root"><button class="btn" aria-expanded="false" data-pop>left</button><div class="pop" data-side="left" hidden>從右緣長出。</div></span>
    <span class="pop-root"><button class="btn" aria-expanded="false" data-pop>right</button><div class="pop" data-side="right" hidden>從左緣長出。</div></span>
  </div>
</section>

<section>
  <h2>content — 記憶詳情</h2>
  <span class="pop-root">
    <button class="btn" aria-expanded="false" data-pop aria-haspopup="dialog">部署走 Cloudflare</button>
    <div class="pop" data-side="bottom" style="min-width:16rem" role="dialog" aria-labelledby="mem-title" hidden>
      <span class="meta">記憶 · 專案</span>
      <h3 id="mem-title">部署走 Cloudflare</h3>
      <p>2026/08/12 由換班交接寫入。之後的 thread 會自動帶上這條,回答部署問題時以 Workers 為前提。</p>
      <div class="actions">
        <button class="btn">編輯</button>
        <button class="btn danger">刪除</button>
      </div>
    </div>
  </span>
</section>

<script>
for (const btn of document.querySelectorAll("[data-pop]")) {
  const pop = btn.nextElementSibling
  const setOpen = open => { pop.hidden = !open; btn.setAttribute("aria-expanded", String(open)) }
  btn.addEventListener("click", () => setOpen(pop.hidden))
  document.addEventListener("click", e => { if (!btn.parentElement.contains(e.target)) setOpen(false) })
  btn.parentElement.addEventListener("keydown", e => { if (e.key === "Escape") { setOpen(false); btn.focus() } })
}
</script>
</html>
