<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tabs — @anyknown/ui prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
:root{--bg:#FAFAF6;--surface:#FFF;--border:#E3E0D5;--border-strong:#C8C3B4;--text:#23211D;--muted:#777165;--faint:#9C958A;--accent:#23705A;--accent-subtle:#E7F0EB;--focus:#23705A}
@media(prefers-color-scheme:dark){:root{--bg:#181613;--surface:#201D18;--border:#35302A;--border-strong:#4A443C;--text:#EAE6DC;--muted:#A59B8C;--faint:#736A5D;--accent:#4FA184;--accent-subtle:#22352E;--focus:#4FA184}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Geist",system-ui,sans-serif;margin:0;padding:3rem 1.5rem;display:grid;gap:2.2rem;justify-content:center}
h1{font:500 1.6rem/1.2 "Newsreader",Georgia,serif;margin:0}
section{display:grid;gap:.8rem;width:min(28rem,100%)}
h2{font:600 .72rem/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
[role=tablist]{display:flex;gap:.25rem;position:relative}
[role=tab]{background:none;border:0;font:500 .875rem/1.3 "Geist",system-ui,sans-serif;color:var(--muted);padding:.45rem .7rem;border-radius:.4rem;cursor:pointer;transition:color 120ms;position:relative}
[role=tab]:hover{color:var(--text)}
[role=tab][aria-selected=true]{color:var(--text)}
[role=tab]:disabled{opacity:.4;cursor:not-allowed}
[role=tab]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[role=tabpanel]{font-size:.875rem;color:var(--muted);padding:.6rem .2rem 0}
[role=tabpanel]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:.3rem}
/* underline variant:正常滑動 */
.underline[role=tablist]{border-bottom:1px solid var(--border)}
/* 兩條邊各自單調往目標走:前緣 expo 快、後緣平滑慢 — 無倒退、無過衝、寬度漸變 */
.underline .indicator{position:absolute;bottom:-1px;height:2px;background:var(--accent)}
.underline [role=tab][aria-selected=true]{color:var(--accent)}
/* pills variant:布(accent-subtle 色系的紗線,seed 10075)織滿整條 tablist 當背景,
   selected 的 highlight 是一個圓角取景窗 — 窗滑到選中的 tab,布本身不動
   (跟 radio 的鏡頭同一個邏輯:布在後面延伸,取景框移動)。 */
.pills[role=tablist]{background:var(--surface);border:1px solid var(--border);border-radius:.55rem;padding:.2rem;gap:.15rem}
.pills .pillbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.pills [role=tab]{z-index:1}
.pillwin{transition:x 240ms cubic-bezier(.16,1,.3,1),width 240ms cubic-bezier(.16,1,.3,1)}
@media(prefers-reduced-motion:reduce){.pillwin{transition:none}}
.pills .pillbg path{fill:none;stroke-linecap:round}
.pills [role=tab][aria-selected=true]{color:var(--accent)}
.pills{--p-un:#CFE2D9;--p-sh:#CBDFD5;--p0:#DFEBE5;--p1:#E3EEE8;--p2:#E7F0EB;--p3:#ECF3EF;--p4:#F1F7F3;--p-hi:#FFF}
@media(prefers-color-scheme:dark){.pills{--p-un:#141F1B;--p-sh:#17231E;--p0:#1D2E27;--p1:#20312B;--p2:#22352E;--p3:#263A32;--p4:#2A4038;--p-hi:#3E5F50}}
@media(prefers-reduced-motion:reduce){.underline .indicator,[role=tab]{transition:none}}
</style>
<h1>Tabs</h1>

<section>
  <h2>underline(預設)· 底線滑動 · 方向鍵</h2>
  <div class="underline" role="tablist" aria-label="Thread 檢視">
    <button role="tab" id="t1" aria-selected="true" aria-controls="p1">對話</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">記憶</button>
    <button role="tab" id="t3" aria-selected="false" aria-controls="p3" tabindex="-1">換班紀錄</button>
    <button role="tab" id="t4" aria-selected="false" aria-controls="p4" tabindex="-1" disabled>檔案</button>
    <span class="indicator" aria-hidden="true"></span>
  </div>
  <div role="tabpanel" id="p1" aria-labelledby="t1" tabindex="0">這個 thread 目前有 12 則訊息。</div>
  <div role="tabpanel" id="p2" aria-labelledby="t2" tabindex="0" hidden>本次工作區共留下 7 條記憶。</div>
  <div role="tabpanel" id="p3" aria-labelledby="t3" tabindex="0" hidden>昨天 18:00 由 Fable 交接給 Opus。</div>
  <div role="tabpanel" id="p4" aria-labelledby="t4" tabindex="0" hidden>尚未開放。</div>
</section>

<section>
  <h2>pills · selected 是一小塊布</h2>
  <div class="pills" role="tablist" aria-label="時間範圍">
    <button role="tab" id="q1" aria-selected="true" aria-controls="r1">今天</button>
    <button role="tab" id="q2" aria-selected="false" aria-controls="r2" tabindex="-1">本週</button>
    <button role="tab" id="q3" aria-selected="false" aria-controls="r3" tabindex="-1">全部</button>
    <svg class="pillbg" aria-hidden="true"></svg>
  </div>
  <div role="tabpanel" id="r1" aria-labelledby="q1" tabindex="0">今天有 3 個 thread 更新。</div>
  <div role="tabpanel" id="r2" aria-labelledby="q2" tabindex="0" hidden>本週累積 18 個 thread。</div>
  <div role="tabpanel" id="r3" aria-labelledby="q3" tabindex="0" hidden>工作區共 142 個 thread。</div>
</section>

<script>
// pills:布織滿整條 tablist(幾何抄 TEXTURE-GUIDE §3,seed 10075,建一次),
// selected highlight = 圓角取景窗(clip rect)滑到選中的 tab — 窗動、布不動,
// 移動時透出的織紋是連續的同一塊布。無 rAF,滑動交給 CSS。
const NS = "http://www.w3.org/2000/svg"
let uid = 0
const SEED = 10075

function mulberry32(seed) {
	let a = seed >>> 0
	return () => {
		a |= 0; a = (a + 0x6D2B79F5) | 0
		let t = Math.imul(a ^ (a >>> 15), 1 | a)
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296
	}
}

function el(name, attrs, parent) {
	const node = document.createElementNS(NS, name)
	for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
	parent?.append(node)
	return node
}

function weaveList(svg, list) {
	const w = list.clientWidth, h = list.clientHeight
	svg.setAttribute("viewBox", `0 0 ${w} ${h}`)
	svg.replaceChildren()
	const id = `tpb${uid++}`
	const rng = mulberry32(SEED)
	const rand = (a, b) => a + rng() * (b - a)
	const W1 = rand(Math.max(120, w * 0.9), w * 1.8)
	const A1 = rand(1.0, 1.8), P1 = rand(0, 6.28), K1 = rand(0.05, 0.11)
	const W2 = rand(w * 1.6, w * 3)
	const A2 = rand(0.5, 0.9), P2 = rand(0, 6.28), K2 = rand(0.03, 0.07)
	const field = (x, y) =>
		A1 * Math.sin((x / W1) * 6.283 + P1 + y * K1) +
		A2 * Math.sin((x / W2) * 6.283 + P2 + y * K2)
	const staticD = (y0) => {
		let d = ""
		for (let x = -4; x <= w + 4; x += 4) d += `${d ? "L" : "M"}${x},${(y0 + field(x, y0)).toFixed(2)}`
		return d
	}
	const defs = el("defs", {}, svg)
	const win = el("rect", { class: "pillwin", x: 0, y: 0, width: 0, height: h, rx: 6.4 }, null)
	el("clipPath", { id }, defs).append(win)
	svg.__win = win
	const body = el("g", { "clip-path": `url(#${id})` }, svg)
	const under = el("g", { stroke: "var(--p-un)" }, body)
	for (let y = -0.8; y < h + 2.6; y += 1.5)
		el("path", { d: staticD(y), "stroke-width": "3.4" }, under)
	const seams = el("g", { stroke: "var(--p-sh)", opacity: ".5" }, body)
	for (let y = 1.6; y < h + 1; y += 2.4)
		el("path", { d: staticD(y), "stroke-width": rand(0.5, 0.8).toFixed(2) }, seams)
	for (let y = 0.6; y < h + 1; y += 1.2 + rand(-0.15, 0.15)) {
		const bucket = Math.min(4, Math.max(0, Math.round(4.2 - (y / h) * 3 + rand(-0.9, 0.9))))
		el("path", { d: staticD(y), "stroke-width": rand(0.6, 1.4).toFixed(2), stroke: `var(--p${bucket})` }, body)
	}
	const hi = el("g", { stroke: "var(--p-hi)", opacity: ".45" }, body)
	for (let i = 0; i < 4; i++) {
		const y = rand(2, h * 0.6)
		el("path", { d: staticD(y), "stroke-width": rand(0.4, 0.7).toFixed(2) }, hi)
	}
}

document.querySelectorAll("[role=tablist]").forEach(list=>{
  const tabs=[...list.querySelectorAll("[role=tab]")];
  const indicator=list.querySelector(".indicator");
  const pillbg=list.querySelector(".pillbg");
  if(pillbg)weaveList(pillbg,list);
  const select=(tab,instant)=>{
    tabs.forEach(t=>{
      const on=t===tab;
      t.setAttribute("aria-selected",on);
      t.tabIndex=on?0:-1;
      document.getElementById(t.getAttribute("aria-controls")).hidden=!on;
    });
    if(indicator){
      const L=tab.offsetLeft, R=list.clientWidth-(tab.offsetLeft+tab.offsetWidth);
      const FAST="240ms cubic-bezier(.16,1,.3,1)", SLOW="240ms cubic-bezier(.4,0,.2,1)";
      const goingRight=L>=(parseFloat(indicator.style.left)||0);
      const off=instant||matchMedia("(prefers-reduced-motion: reduce)").matches;
      indicator.style.transition=off?"none":goingRight?`left ${SLOW},right ${FAST}`:`left ${FAST},right ${SLOW}`;
      indicator.style.left=L+"px";indicator.style.right=R+"px";
    }
    if(pillbg){
      const win=pillbg.__win;
      if(instant)win.style.transition="none";
      win.style.x=tab.offsetLeft+"px";
      win.style.y=tab.offsetTop+"px";
      win.style.width=tab.offsetWidth+"px";
      win.style.height=tab.offsetHeight+"px";
      if(instant){win.getBoundingClientRect();win.style.transition=""}
    }
  };
  tabs.forEach(tab=>{
    tab.addEventListener("click",()=>!tab.disabled&&select(tab));
    tab.addEventListener("keydown",e=>{
      if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
      e.preventDefault();
      const enabled=tabs.filter(t=>!t.disabled);
      let i=enabled.indexOf(tab)+(e.key==="ArrowRight"?1:-1);
      const next=enabled[(i+enabled.length)%enabled.length];
      next.focus();select(next);
    });
  });
  select(tabs.find(t=>t.getAttribute("aria-selected")==="true"),true);
});
</script>
</html>
